  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #faf8f6;
      color: #1c1917;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      -webkit-tap-highlight-color: transparent;
    }
    h1, h2, h3, .font-serif {
      font-family: 'Playfair Display', Georgia, serif;
    }
    h1, h2, h3 {
      text-wrap: balance;
    }
    .tabular-nums {
      font-variant-numeric: tabular-nums;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 5px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(168, 162, 158, 0.45);
      border-radius: 9999px;
    }
    .scrollbar-hide::-webkit-scrollbar {
      display: none;
    }
    .scrollbar-hide {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fadeIn {
      animation: fadeIn 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes slideDown {
      from { transform: translate(-50%, -120%); opacity: 0; }
      to { transform: translate(-50%, 0); opacity: 1; }
    }
    @media (min-width: 768px) {
      @keyframes slideDown {
        from { transform: translate(0, -120%); opacity: 0; }
        to { transform: translate(0, 0); opacity: 1; }
      }
    }
    .animate-slideDown {
      animation: slideDown 0.32s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes companionBreathe {
      0%, 100% {
        transform: translateY(0px) scale(1);
      }
      50% {
        transform: translateY(-3px) scale(1.015);
      }
    }
    .animate-companion-breathe {
      animation: companionBreathe 4.2s ease-in-out infinite;
    }
    @keyframes companionWave {
      0%, 100% {
        transform: rotate(0deg);
      }
      20%, 60% {
        transform: rotate(16deg);
      }
      40%, 80% {
        transform: rotate(-8deg);
      }
    }
    .animate-companion-wave {
      animation: companionWave 1.2s ease-in-out infinite;
    }
    @keyframes floatPetal {
      0%, 100% {
        transform: translateY(0px) rotate(0deg);
      }
      50% {
        transform: translateY(-6px) rotate(14deg);
      }
    }
    .animate-float-petal {
      animation: floatPetal 3.8s ease-in-out infinite;
    }
    @keyframes celestialGlow {
      0%, 100% {
        box-shadow: 0 0 12px rgba(244, 114, 182, 0.28);
      }
      50% {
        box-shadow: 0 0 22px rgba(244, 114, 182, 0.45);
      }
    }
    .animate-celestial-glow {
      animation: celestialGlow 3s ease-in-out infinite;
    }
    @keyframes speechBubbleFloat {
      0%, 100% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(-2px);
      }
    }
    .animate-speech-bubble {
      animation: speechBubbleFloat 4s ease-in-out infinite;
    }
    @media (prefers-reduced-motion: reduce) {
      .animate-companion-breathe,
      .animate-companion-wave,
      .animate-float-petal,
      .animate-celestial-glow,
      .animate-speech-bubble,
      .animate-fadeIn {
        animation: none !important;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
